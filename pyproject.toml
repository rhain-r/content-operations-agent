[project]
name = "video-qa"
version = "0.1.0"
description = "Video CI/CD pipeline: breaks a finished short-form video into frames and a timestamped transcript, has Claude QA it, and pings the editor in Slack on failure."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.11,<2",
    "fastapi>=0.142",
    "ffmpeg-python>=0.2.0",
    "httpx>=0.28",
    "httpx2>=2.13",
    "jinja2>=3.1",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "python-multipart>=0.0.32",
    "uvicorn[standard]>=0.54",
]

[dependency-groups]
dev = [
    "mypy>=2.4",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
    "ruff>=0.16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/video_qa"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "ASYNC", "RUF", "PT", "C4", "RET", "N"]
# The en dash is deliberate: it is the range separator in the Slack messages.
allowed-confusables = ["–"]

[tool.ruff.lint.per-file-ignores]
# Tests may touch the filesystem directly inside async test functions.
"tests/**" = ["ASYNC240"]

[tool.ruff.lint.isort]
known-local-folder = ["helpers"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["ffmpeg", "ffmpeg.*"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra"
