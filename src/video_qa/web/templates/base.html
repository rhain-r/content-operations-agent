<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Video Checker{% endblock %}</title>
  <link rel="stylesheet" href="{{ links.asset('app.css') }}?v={{ asset_version }}">
  <script src="{{ links.asset('app.js') }}?v={{ asset_version }}" defer></script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>
  <header class="site-header">
    <div class="container site-header-inner">
      <a class="brand" href="{{ links.home() }}">
        <span class="brand-mark" aria-hidden="true">▶</span>
        <span>Video Checker</span>
      </a>
      <span class="site-tagline">Checks short videos before they're posted</span>
    </div>
  </header>
  <main id="main" class="container">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
